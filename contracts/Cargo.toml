[workspace]
resolver = "2"
members = [
    "escrow",
    "multisig",
    "gateway",
    "vault",
]

[workspace.dependencies]
soroban-sdk = "21.7.7"

# Pin ed25519-dalek 2.x: soroban-env-host 21.2.x is incompatible with ed25519-dalek 3.x
# when Cargo.lock is absent (fresh `cargo update` on CI).
[patch.crates-io]
ed25519-dalek = { version = "=2.2.3" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
